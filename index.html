<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS460 VR Portal</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <a class="src" href="https://threejs.org">https://threejs.org</a>
        <img class="examples" src="images/three.js.png" width="352" height="115" alt="three.js examples, webxr">
      </div>
      <img class="controls" src="images/vr_basic_controls.png" width="1402" height="858" alt="Quest controllers">
    </header>

    <main class="grid">
      <a class="card" href="https://threejs.org/examples/webxr_vr_panorama_depth.html">
        <img src="images/webxr_vr_panorama_depth.jpg" width="400" height="250" alt="">
        <span>vr / panorama / depth</span>
      </a>
      <a class="card" href="https://threejs.org/examples/webxr_vr_rollercoaster.html">
        <img src="images/webxr_vr_rollercoaster.jpg" width="400" height="250" alt="">
        <span>vr / rollercoaster</span>
      </a>
      <a class="card" href="https://threejs.org/examples/webxr_vr_sandbox.html">
        <img src="images/webxr_vr_sandbox.jpg" width="400" height="250" alt="">
        <span>vr / sandbox</span>
      </a>
      <a class="card" href="https://threejs.org/examples/webxr_xr_ballshooter.html">
        <img src="images/webxr_xr_ballshooter.jpg" width="400" height="250" alt="">
        <span>xr / ballshooter</span>
      </a>
      <a class="card" href="https://threejs.org/examples/webxr_xr_sculpt.html">
        <img src="images/webxr_xr_sculpt.jpg" width="400" height="250" alt="">
        <span>xr / sculpt</span>
      </a>
    </main>

    <p class="enter">ENTER VR</p>
  </div>
</body>
</html>
